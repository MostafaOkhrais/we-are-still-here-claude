name = "we-are-still-here"
compatibility_date = "2025-07-01"
pages_build_output_dir = "./public"

# Cloudflare D1 database. Create it once with:  npx wrangler d1 create wash-db
# then paste the printed database_id below. (Local development works with any value.)
[[d1_databases]]
binding = "DB"
database_name = "wash-db"
database_id = "20066569-a84d-4caa-875b-5c37ce2160f2"
migrations_dir = "migrations"

# Public settings (not secrets). With a Wrangler file in the project, Cloudflare Pages reads settings from
# here, so they are kept in the repository. IP_SALT, RESEND_API_KEY and SITE_URL are set as Pages secrets instead
# (SITE_URL is not secret, but a value here would also be used by local development): see DEPLOY-CLOUDFLARE.txt.
[vars]
EMAIL_FROM = "We Are Still Here <noreply@wearestillhere.uk>"
NOTIFY_EMAIL = "info@wearestillhere.uk"
# CONTACT_RECEIPT = "1"   # uncomment to send visitors an automatic "we received your message" email
